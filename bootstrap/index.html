<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>siseven</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>


<div class="container">
    <div class="row">
        <div class="col">
            <div class="card">
                <div class="card-body">
                    <form action="" method="post">
                        <p>Tu nombre</p><input type="text" id="nombre" name=nombre class="form-control" required>
                        <p>Tu apellido</p><input type="text" id="apellido" name="apellido" class="form-control" required>
                        <p>Tu Correo</p><input type="email" id="correo" name="correo" class="form-control" required>
                        <button onclick="EnviarDatos()" class="btn btn-primary mt-2" type="button">Enviar</button>
                    </form>
                </div>
                <div class="card">
                    <div class="card-body">
                        <p>Bienvenido: <span id="tu_nombre"></span>
                        <span id="tu_Apellido"></span>
                        <br><span id="tu_correo"></span></p>
                    </div>
                </div>
                
            </div>
        </div>
    </div>
</div>
<script>
    function EnviarDatos(){
        var nombre = document.getElementById('nombre');
        document.getElementById('tu_nombre')
        var apellido =document.getElementById('apellido');
        document.getElementById('tu_Apellido')
        var correo =document.getElementById('correo');
        document.getElementById('tu_correo')
        var boton = document.querySelector("button");

        if (nombre.value !=="" && apellido.value !=="" && correo.value !==""){
        nombre.classList.add("isvalid");
        apellido.classList.add("isvalid");
        correo.classList.add("isvalid");
        nombre.classList.remove("invalid");
        apellido.classList.remove("invalid");
        correo.classList.remove("invalid");
        document.getElementById("tu_nombre").innerText = nombre.value;
        document.getElementById("tu_Apellido").innerText = apellido.value;
        document.getElementById("tu_correo").innerText = correo.value;

        boton.classList.add("isvalid");
        }
        else {
             nombre.classList.remove("isvalid");
        apellido.classList.remove("isvalid");
        correo.classList.remove("isvalid");
         nombre.classList.add("invalid");
        apellido.classList.add("invalid");
        correo.classList.add("invalid");
         boton.classList.add("invalid");


        }
    }

    
    
</script>


</body>
</html>
